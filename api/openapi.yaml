openapi: 3.0.3

info:
  version: 1.0.0
  title: Raikada Recording Server API
  description: |
    HTTP control API exposed by the Raikada Recording Server — the
    on-prem appliance defined in this repository. This is the recorder's
    local control surface. It is invoked by the Management Server over
    the recorder-initiated WebSocket per ADR 0003 (Connectivity model),
    and by LAN clients when authorized. Off-LAN clients reach this
    surface via the Cloud-brokered FRP tunnel.

    **/v1 reshape (ADR 0009).** This document describes the canonical
    `/v1/...` API per ADR 0009. The MediaMTX-lineage `/v3` surface is
    gone; there is no deprecation window and no alias. Every endpoint
    keys on canonical UUIDs (per ADR 0009 §D4); every request and
    response shape uses **snake_case** JSON keys. The single small
    legacy carve-out is `Stream.tracks[].codec_props`: those nine
    discriminated codec sub-shapes inherit the upstream MediaMTX
    camelCase JSON tags (`channelCount`, `sampleRate`, `bitDepth`,
    `muLaw`) and have not been renamed; the inconsistency is tracked
    as a Phase 3 follow-up.

    **In-house error envelope (D15).** Errors return the in-house
    `{ status: "error", error: <message> }` shape, not RFC 7807
    `application/problem+json`. Successful writes that have nothing to
    say return `{ status: "ok" }`. The decision to keep the in-house
    shape is documented in canonical-divergence D15 and a future
    platform-API-contracts ADR will revisit it.

    **`tenant_id` on responses (D1).** Every detail-level response and
    every list item carries a `tenant_id` field identifying the tenant
    the recorder is bound to. The value comes from the recorder's
    bootstrap config and is the same for every response from a given
    recorder. List wrappers themselves do not carry the field; their
    items do. Snake_case throughout the canonical /v1 surface — the
    older /v3 surface used `tenantId` (camelCase); both forms recorded
    here for archaeology, only the snake_case form survives.

    **`tenant_id` on requests.** PATCH / POST / PUT bodies on /v1
    accept an optional `tenant_id` field. If present and matching the
    recorder's bound tenant the request proceeds; if present and
    mismatched the recorder returns 403. If omitted, the recorder uses
    its own tenant id implicitly.

    The escape-hatch endpoints under `/v1/recorder/...` split into two
    families on the request key:

    - `camera-source-config` and `camera-hooks` accept `tenant_id`
      (snake_case), matching the canonical /v1 convention.
    - `recorder/config` and `recorder/camera-defaults` accept
      `tenantId` (camelCase). These two endpoints wrap MediaMTX-
      lineage shapes (`conf.OptionalGlobal`, `conf.OptionalPath`)
      whose body is camelCase throughout; using snake_case for just
      the tenant key would split the body across two casings. The
      camelCase here is internally consistent, not a stale carve-out.
      A future refactor that renames the underlying MediaMTX-lineage
      shapes to snake_case would naturally pull the tenant key along
      with them.

    **Source-URL redaction (D4).** `Camera.source_url` and the
    `source` field returned by `/v1/recorder/camera-defaults` have any
    embedded userinfo (`user:pass@host`) replaced with
    `redacted:redacted@host` on responses. The recorder still accepts
    full credential-bearing URLs on writes; only the response side is
    redacted. The full canonical fix (split into `source_url` +
    `credentials_ref`) lives in ADR 0009; the
    `Camera.credentials_ref` field is now present.

    **`query_string` redaction (D12).** Every Stream-level
    `query_string` field — both on `Stream` itself and on any nested
    descriptors — runs through a pre-serialization redaction step.
    Values for keys matching `token`, `password`, `key`, or `secret`
    (case-insensitive substring) are replaced with the literal
    `redacted` before the response is emitted; the keys themselves
    remain visible so a reviewer can see that a sensitive parameter
    was present without seeing what it was. Other keys pass through
    unchanged. Per-key visibility makes this a defense-in-depth
    filter, not a hard guarantee — clients should not rely on it for
    credential confidentiality.

    **`remote_addr` redaction.** `Stream.remote_addr` and any nested
    remote-addr fields (e.g.
    `Stream.protocol_specific.transport_connections[].remote_addr` on
    RTSP streams; WebRTC ICE candidate descriptors) are PII and are
    replaced with the literal `redacted` on responses. A future
    fine-grained role permission (`session.pii.read`) may unmask them
    for callers that hold it; until that catalog lands, the value is
    redacted unconditionally. See canonical-divergence D5.

    **Discriminated unions.** Three canonical types carry
    discriminated payloads:

    - `Camera.source_config` — discriminator field `source_type` on
      the parent `Camera` (not inside `source_config`).
    - `Stream.protocol_specific` — discriminator field `protocol` on
      the parent `Stream`.
    - `Stream.tracks[].codec_props` — discriminator field `codec` on
      the parent `tracks[]` element.

    OpenAPI 3.0's `discriminator` keyword requires the discriminator
    to live inside each variant; the canonical Raikada placement puts
    it on the parent. The schemas below model each union as `oneOf`
    without a strict `discriminator` property, with the parent's
    discriminator field documenting which variant applies. Generators
    that need a strict discriminator should read the discriminator
    field off the parent.

    Per-field classifications follow `../../platform/docs/data-classification.md`.
    **Operational is the default**: schemas and fields without an
    explicit `x-classification` are Operational. Only divergent
    classifications (PII, Sensitive, Credential, Restricted) are
    annotated. Divergences from the canonical domain model in
    `../../platform/docs/domain-model.md` are tracked separately in
    `../docs/canonical-divergences.md`.

servers:
  - url: http://localhost:9997
    description: Default LAN-side listener.

tags:
  - name: Info
    description: Recorder identity and metadata.
  - name: Auth
    description: |
      Auth-system administration endpoints. Currently a single
      issuer-material refresh hook (renamed mechanism-neutrally from
      the legacy `/v3/auth/jwks/refresh`). The recorder validates
      inbound credentials via a global middleware on every endpoint;
      see the security section for accepted credential types.
  - name: Cameras
    description: |
      Canonical Camera entities. Cameras are owned by the Management
      Server when one is paired; the recorder caches and reports.
      Per ADR 0009 §D3 each Camera response carries a small `runtime`
      block (`online`, `available`, `last_online_at`) that answers
      the most common UI question without forcing a separate
      `/v1/streams` call.
  - name: RecordingPolicies
    description: |
      Canonical RecordingPolicy entities. Multiple cameras share a
      policy by referencing its `id` from `Camera.recording_policy_id`.
      DELETE rejects when any camera still references the policy.
  - name: Streams
    description: |
      Active runtime sessions across every protocol the recorder
      serves (RTSP/RTSPS, RTMP/RTMPS, SRT, WebRTC, HLS). The unified
      `/v1/streams` surface folds in 25 protocol-specific endpoints
      from the legacy /v3 surface; per-protocol detail lives on the
      response in `protocol_specific`, not in the URL. `DELETE` is
      the canonical kick verb for a runtime resource.
  - name: Recordings
    description: |
      Canonical Recording entities — continuous spans of recorded
      footage. The client/scrub primitive. List omits the embedded
      segment array; GET-by-id includes it. Playback handles are
      issued by `/v1/recordings/{id}/playback`.
  - name: RecordingSegments
    description: |
      Canonical RecordingSegment entities — the storage-level unit of
      recorded footage. Used primarily for storage-ops listings and
      per-segment delete. Scrub UX uses Recordings, not segments.
  - name: Clips
    description: |
      Canonical Clip entities — user-defined, persistent saved-moment
      ranges. The recorder is authoritative for preparing the export
      artifact (stitching source segments into a single mp4, writing
      it to local storage, computing checksums, serving the download).
      Clips override policy-driven retention: source segments cannot
      be pruned while the clip is requested/preparing/ready.

      Pre-MS phase: `requested_by` is the empty string. Stitching
      performs an in-process fmp4-to-mp4 remux of the source
      segments, producing a single mp4 with one moov and a
      monotonic timeline (playable by QuickTime, web `<video>`
      elements, ffprobe, VLC, etc.). The `notice` field on each
      Clip response is reserved for future operational caveats and
      is empty in this build.
  - name: Events
    description: |
      Canonical Event entries emitted by the recorder. The in-memory
      ring buffer is fed by these wired producers: camera.online /
      camera.offline (path lifecycle), auth.failed_login (request
      authentication), config.applied / policy.applied (camera,
      policy, and recorder-config writes), and segment.write_failed
      (recordstore wires it via SetSegmentEventTarget). Producers not
      yet wired: auth.session_started (ADR 0011 unblocks the kind via
      jti-keyed session lifecycle, but the recorder doesn't yet track
      jti-dedup; small follow-up) and storage.volume_full (sits deeper
      in the cleaner subsystem). An empty list response carries a
      top-level `notice` field describing this state.
  - name: Audit
    description: |
      Tamper-evident AuditLogEntry chain per ADR 0006. Append-only;
      the recorder is one emitter (emitter_kind=recording_server) and
      maintains a single in-process chain (per ADR 0005 a recorder is
      bound to one tenant per appliance). When the buffer crosses 80%
      capacity the recorder enters degraded mode and refuses new
      administrative actions; recording continues uninterrupted per
      ADR 0006 D6.
  - name: Health
    description: |
      A single `HealthStatus` snapshot endpoint per ADR 0009 §D2.
      Fine-grained metrics live in the Prometheus surface and are
      out of scope here.
  - name: StorageVolumes
    description: |
      Read-only StorageVolume listings. Volume-bootstrap configuration
      lives in `/v1/recorder/config` per the escape-hatch boundary;
      this surface is observability only.
  - name: Recorder
    description: |
      Recorder-localized escape hatch per ADR 0009 §D6. Bounded
      single namespace at `/v1/recorder/...`. Now also surfaces
      configuration-UI-driven endpoints (identity, network-info,
      reboot, config-backup, config-restore) that are recorder-
      operational rather than canonical-entity. The MS does not
      project this namespace upward; it is recorder-internal.
  - name: Diagnostics
    description: |
      Cross-platform diagnostic test runners powering the config
      UI's Diagnostics page. All handlers are stdlib- or gopsutil-
      based — no shell-outs to system tools — so they work
      identically on Linux, macOS, Windows, and BSD. Three runners
      today: TCP-handshake ping, SNTP drift query, and a TCP probe
      across every configured camera path.

security:
  - basicAuth: []
  - bearerJWT: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials. Validated against the recorder's
        configured auth manager (internal, HTTP, or JWT-backed) on
        every request.
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard JWT bearer token. Validated against JWKS held by the
        recorder's auth manager. Use
        `POST /v1/auth/refresh-issuer-material` to force a JWKS
        reload after key rotation.

        Note: a `Bearer` token that happens to contain a colon (e.g.
        the upstream MediaMTX `user:pass` convention) is treated
        opaquely as a token here, not as colon-separated credentials.
        Clients that need username+password authentication must use
        `basicAuth`. See D6 in
        `recorder/docs/canonical-divergences.md`.

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
      description: Zero-based page index.
    ItemsPerPage:
      name: items_per_page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
      description: |
        Items per page; default 100. The list-response wrapper
        carries `item_count` (total before pagination), `page_count`,
        and the windowed `items` array.

  schemas:
    # ----- Status / envelope shapes ---------------------------------

    OKStatus:
      type: string
      enum: [ok]

    ErrorStatus:
      type: string
      enum: [error]

    OK:
      type: object
      description: |
        Successful-write envelope. Used for `DELETE` and PATCH calls
        that have no body to return. Per canonical-divergence D15
        this is an in-house shape, not RFC 7807.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OKStatus'

    Error:
      type: object
      description: |
        In-house error envelope. The HTTP status code carries the
        primary signal; `error` is a free-form human-readable
        message. Per canonical-divergence D15 a future
        platform-API-contracts ADR may migrate this to RFC 7807.
      required: [status, error]
      properties:
        status:
          $ref: '#/components/schemas/ErrorStatus'
        error:
          type: string

    PaginationListWrapper:
      type: object
      description: |
        Common pagination envelope. Concrete list responses substitute
        their own item type for `items[]`.
      required: [item_count, page_count, items]
      properties:
        item_count:
          type: integer
          description: Total items matching the query, before pagination.
        page_count:
          type: integer
          description: Total page count for the current `items_per_page`.
        items:
          type: array
          items: {}

    # ----- Info -----------------------------------------------------

    Info:
      type: object
      required: [tenant_id, version, started]
      properties:
        tenant_id:
          type: string
          description: |
            Tenant the recorder is bound to. Set in the bootstrap
            config until the pairing flow lands per ADR 0002.
            Closes canonical-divergence D1.
        version:
          type: string
          description: Recorder build version string.
        started:
          type: string
          format: date-time
          description: Recorder process start time.

    # ----- Enumerations --------------------------------------------

    CameraSourceType:
      type: string
      description: |
        Source-mode discriminator for `Camera`. Renamed from the
        legacy `transport` per ADR 0009 §"Camera amendment". Drives
        the `source_config` discriminated union. `mpegts_udp` was
        added per ADR 0009 §D9 (the OQ6 ratification) to distinguish
        MPEG-TS-over-UDP from raw RTP-with-SDP — covers `udp://`,
        `udp+mpegts://`, and `unix+mpegts://` source URLs.
      enum:
        - rtsp
        - rtsps
        - rtmp
        - rtmps
        - srt
        - rtp
        - mpegts_udp
        - whep
        - hls
        - file
        - redirect
        - publish
        - rpi_camera

    CameraTransport:
      type: string
      description: Transport mode for RTSP/RTSPS/RTMP/RTMPS/SRT pull sources.
      enum:
        - tcp
        - udp
        - udp_multicast

    StreamProtocol:
      type: string
      description: |
        Wire protocol of an active Stream. Extends the legacy
        `protocol` enum with `rtsps` / `rtmps` to track TLS variants
        per ADR 0009 §"Stream amendments".
      enum:
        - rtsp
        - rtsps
        - rtmp
        - rtmps
        - srt
        - webrtc
        - hls

    StreamDirection:
      type: string
      description: |
        Whether this Stream publishes media to the recorder or reads
        media from it. New in ADR 0009.
      enum:
        - publish
        - read

    StreamState:
      type: string
      description: |
        Canonical lifecycle state per `domain-model.md` §Stream.
        Protocol-specific state (RTMP idle/read/publish, etc.) lives
        on `protocol_specific`, not here.
      enum:
        - connecting
        - active
        - stalled
        - ended
        - errored

    StreamTrackKind:
      type: string
      enum:
        - video
        - audio
        - metadata

    RTSPTransport:
      type: string
      description: Transport mode of an RTSP / RTSPS session.
      enum:
        - tcp
        - udp
        - udp_multicast

    RTMPState:
      type: string
      enum:
        - idle
        - read
        - publish

    RecordingPolicyMode:
      type: string
      enum:
        - continuous
        - motion
        - schedule
        - event_triggered
        - off

    RecordingPolicyContainer:
      type: string
      enum:
        - fmp4
        - mpegts

    RecordingState:
      type: string
      description: |
        Recording lifecycle: `active → sealed`; `sealed → archived |
        deleted`; `(any) → failed`.
      enum:
        - active
        - sealed
        - archived
        - failed
        - deleted

    RecordingSegmentContainer:
      type: string
      enum:
        - fmp4
        - mpegts

    RecordingSegmentState:
      type: string
      enum:
        - recording
        - sealed
        - archived
        - deleted

    EventSeverity:
      type: string
      enum:
        - debug
        - info
        - warning
        - error
        - critical

    EventSubjectKind:
      type: string
      enum:
        - camera
        - stream
        - segment
        - volume
        - server
        - user
        - session

    StorageVolumeKind:
      type: string
      enum:
        - internal_disk
        - external_disk
        - network_share
        - ramdisk

    StorageVolumeStatus:
      type: string
      enum:
        - healthy
        - degraded
        - full
        - missing
        - read_only

    HealthStatusOverall:
      type: string
      enum:
        - healthy
        - degraded
        - unhealthy

    HealthStatusVolumeState:
      type: string
      enum:
        - healthy
        - degraded
        - full
        - read_only

    # ----- Camera --------------------------------------------------

    CameraOnDemand:
      type: object
      description: |
        On-demand activation. The camera's source starts only after
        a consumer connects, and tears down after `close_after` of
        inactivity.
      required: [enabled, start_timeout, close_after]
      properties:
        enabled:
          type: boolean
        start_timeout:
          type: string
          description: Go duration string (e.g. `10s`, `2m`).
        close_after:
          type: string
          description: Go duration string.

    CameraAlwaysAvailable:
      type: object
      description: |
        File-based fallback served when the configured source is
        offline.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        file:
          type: string
          x-classification: sensitive
          description: |
            Recorder-local path to the fallback file. Sensitive per
            data-classification.md (filesystem layout).
        tracks:
          type: array
          items:
            type: string

    CameraRuntime:
      type: object
      description: |
        Recorder-reported runtime block per ADR 0009 §D3. **Read-only
        at the API**: writes ignore this block.
      required: [online, available]
      properties:
        online:
          type: boolean
        available:
          type: boolean
        last_online_at:
          type: string
          format: date-time

    SourceConfigRTSP:
      type: object
      description: |
        `source_config` variant for `source_type=rtsp` /
        `source_type=rtsps`.
      properties:
        transport:
          $ref: '#/components/schemas/CameraTransport'
        passphrase:
          type: string
          x-classification: credential
          description: |
            Optional pull-side passphrase. Held under the credential
            store via `credentials_ref` in the canonical model; this
            inline form is recorder-local.

    SourceConfigRTMP:
      type: object
      description: |
        `source_config` variant for `source_type=rtmp` /
        `source_type=rtmps`.
      properties:
        transport:
          $ref: '#/components/schemas/CameraTransport'

    SourceConfigSRT:
      type: object
      description: '`source_config` variant for `source_type=srt`.'
      properties:
        transport:
          $ref: '#/components/schemas/CameraTransport'
        passphrase:
          type: string
          x-classification: credential

    SourceConfigWHEP:
      type: object
      description: |
        `source_config` variant for `source_type=whep`. Bearer token
        held under a credential-store ref, not inlined.
      properties:
        bearer_token_ref:
          type: string
          description: |
            Opaque reference into the credential store. The
            referenced material is Credential-classified; the ref
            itself is Operational.

    SourceConfigRedirect:
      type: object
      description: '`source_config` variant for `source_type=redirect`.'
      required: [target]
      properties:
        target:
          type: string

    SourceConfigFile:
      type: object
      description: '`source_config` variant for `source_type=file`.'
      required: [path]
      properties:
        path:
          type: string
          x-classification: sensitive
          description: Recorder-local path to the source file.

    SourceConfigPublish:
      type: object
      description: |
        `source_config` variant for `source_type=publish`. Empty
        canonical sub-shape — a publish path simply waits for
        any-protocol publish.
      additionalProperties: false

    SourceConfigRPiCamera:
      type: object
      description: |
        `source_config` variant for `source_type=rpi_camera`. Empty
        canonical marker per ADR 0009. The real ~30-field RPi-camera
        configuration lives in the recorder-localized escape hatch at
        `/v1/recorder/cameras/{id}/source-config`.
      additionalProperties: false

    SourceConfigRTP:
      type: object
      description: |
        `source_config` variant for `source_type=rtp`. Empty canonical
        sub-shape; the SDP descriptor location is captured by
        `Camera.source_url`.
      additionalProperties: false

    SourceConfigHLS:
      type: object
      description: |
        `source_config` variant for `source_type=hls`. Empty canonical
        sub-shape; HLS pulls do not carry extra knobs today.
      additionalProperties: false

    SourceConfig:
      description: |
        Discriminated union of source-mode-specific options on
        `Camera`. The discriminator is `source_type` on the parent
        `Camera`, not a field inside this object — OpenAPI 3.0's
        strict `discriminator` keyword requires the discriminator
        field to live inside each variant, which the canonical
        Raikada model does not. Consumers must read `source_type`
        off the parent to pick a variant.
      oneOf:
        - $ref: '#/components/schemas/SourceConfigRTSP'
        - $ref: '#/components/schemas/SourceConfigRTMP'
        - $ref: '#/components/schemas/SourceConfigSRT'
        - $ref: '#/components/schemas/SourceConfigWHEP'
        - $ref: '#/components/schemas/SourceConfigRedirect'
        - $ref: '#/components/schemas/SourceConfigFile'
        - $ref: '#/components/schemas/SourceConfigPublish'
        - $ref: '#/components/schemas/SourceConfigRPiCamera'
        - $ref: '#/components/schemas/SourceConfigRTP'
        - $ref: '#/components/schemas/SourceConfigHLS'

    Camera:
      type: object
      description: |
        Canonical Camera entity. The MS owns Camera authoritatively;
        the recorder caches and reports. Closes canonical-divergences
        D2 / D3 / D7.
      required:
        - id
        - tenant_id
        - site_id
        - recording_server_id
        - name
        - source_type
        - source_url
        - use_absolute_timestamp
        - override_publisher
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        name:
          type: string
          x-classification: sensitive
          description: |
            Operator-given name. Sensitive per data-classification.md
            ("Front Door", "Server Room A" — descriptive of the
            customer's premises).
        source_type:
          $ref: '#/components/schemas/CameraSourceType'
        source_url:
          type: string
          x-classification: sensitive
          description: |
            URL structure (host/port/path). Plaintext credentials
            must never appear here in production; on the response
            side any embedded userinfo is replaced with
            `redacted:redacted@host` (canonical-divergence D4
            mitigation).
        credentials_ref:
          type: string
          description: |
            Opaque reference into the credential store. The field
            itself is Operational; the referenced material (camera
            password, etc.) is Credential.
        source_config:
          $ref: '#/components/schemas/SourceConfig'
        recording_policy_id:
          type: string
          format: uuid
          description: References a `RecordingPolicy.id`.
        on_demand:
          $ref: '#/components/schemas/CameraOnDemand'
        max_readers:
          type: integer
          description: Concurrent-consumer cap.
        fallback_camera_id:
          type: string
          format: uuid
        always_available:
          $ref: '#/components/schemas/CameraAlwaysAvailable'
        source_fingerprint:
          type: string
          description: Pinned upstream TLS certificate fingerprint.
        use_absolute_timestamp:
          type: boolean
        override_publisher:
          type: boolean
        runtime:
          $ref: '#/components/schemas/CameraRuntime'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CameraList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Camera'

    # ----- RecordingPolicy ----------------------------------------

    RecordingPolicyScheduleWindow:
      type: object
      required: [days, start, end]
      properties:
        days:
          type: array
          items:
            type: string
        start:
          type: string
          description: Local-time HH:MM start.
        end:
          type: string
          description: Local-time HH:MM end.

    RecordingPolicySchedule:
      type: object
      required: [timezone, windows]
      properties:
        timezone:
          type: string
        windows:
          type: array
          items:
            $ref: '#/components/schemas/RecordingPolicyScheduleWindow'

    RecordingPolicy:
      type: object
      description: |
        Canonical RecordingPolicy entity. Multiple cameras may share
        a policy. The MS owns RecordingPolicy authoritatively; the
        recorder caches and enforces. Adds `part_duration`,
        `max_part_size`, and `record_path_template` per ADR 0009.
      required:
        - id
        - tenant_id
        - name
        - mode
        - retention_duration
        - min_segment_duration
        - max_segment_duration
        - container
        - enabled
        - part_duration
        - max_part_size
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
          x-classification: sensitive
        mode:
          $ref: '#/components/schemas/RecordingPolicyMode'
        schedule:
          $ref: '#/components/schemas/RecordingPolicySchedule'
        retention_duration:
          type: string
          description: Go duration string (e.g. `168h` for 7 days).
        min_segment_duration:
          type: string
        max_segment_duration:
          type: string
        container:
          $ref: '#/components/schemas/RecordingPolicyContainer'
        pre_event_buffer:
          type: string
        post_event_buffer:
          type: string
        enabled:
          type: boolean
        part_duration:
          type: string
          description: fMP4 part duration.
        max_part_size:
          type: integer
          format: int64
          description: fMP4 part size cap (bytes).
        record_path_template:
          type: string
          description: |
            Recorder-local on-disk path-name template. May carry
            tenant/site/camera placeholders; never customer-PII.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RecordingPolicyList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RecordingPolicy'

    # ----- Stream + protocol_specific -----------------------------

    APIPathTrackCodecPropsAV1:
      type: object
      description: codec_props variant for codec=AV1.
      properties:
        width:
          type: integer
        height:
          type: integer
        profile:
          type: integer
        level:
          type: integer
        tier:
          type: integer

    APIPathTrackCodecPropsVP9:
      type: object
      description: codec_props variant for codec=VP9.
      properties:
        profile:
          type: integer

    APIPathTrackCodecPropsH265:
      type: object
      description: codec_props variant for codec=H265.
      properties:
        width:
          type: integer
        height:
          type: integer
        profile:
          type: string
        level:
          type: string

    APIPathTrackCodecPropsH264:
      type: object
      description: codec_props variant for codec=H264.
      properties:
        width:
          type: integer
        height:
          type: integer
        profile:
          type: string
        level:
          type: string

    APIPathTrackCodecPropsOpus:
      type: object
      description: |
        codec_props variant for codec=Opus. NOTE: the JSON keys
        retain MediaMTX-lineage **camelCase** (`channelCount`),
        unlike the snake_case used elsewhere on the canonical /v1
        surface. Tracked as a Phase 3 follow-up.
      properties:
        channelCount:
          type: integer

    APIPathTrackCodecPropsMPEG4Audio:
      type: object
      description: |
        codec_props variant for codec=MPEG-4 Audio. JSON keys retain
        camelCase (`sampleRate`, `channelCount`).
      properties:
        sampleRate:
          type: integer
        channelCount:
          type: integer

    APIPathTrackCodecPropsAC3:
      type: object
      description: |
        codec_props variant for codec=AC3. JSON keys retain camelCase.
      properties:
        sampleRate:
          type: integer
        channelCount:
          type: integer

    APIPathTrackCodecPropsG711:
      type: object
      description: |
        codec_props variant for codec=G711. JSON keys retain camelCase
        (`muLaw`, `sampleRate`, `channelCount`).
      properties:
        muLaw:
          type: boolean
        sampleRate:
          type: integer
        channelCount:
          type: integer

    APIPathTrackCodecPropsLPCM:
      type: object
      description: |
        codec_props variant for codec=LPCM. JSON keys retain camelCase
        (`bitDepth`, `sampleRate`, `channelCount`).
      properties:
        bitDepth:
          type: integer
        sampleRate:
          type: integer
        channelCount:
          type: integer

    APIPathTrackCodecProps:
      description: |
        Discriminated union of codec-specific properties. The
        discriminator is `codec` on the parent `tracks[]` element,
        not inside this object. NOTE: variant fields use camelCase
        JSON keys for compatibility with the upstream MediaMTX shape;
        the rest of the canonical /v1 surface uses snake_case. This
        inconsistency is tracked as a Phase 3 follow-up.
      oneOf:
        - $ref: '#/components/schemas/APIPathTrackCodecPropsAV1'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsVP9'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsH265'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsH264'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsOpus'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsMPEG4Audio'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsAC3'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsG711'
        - $ref: '#/components/schemas/APIPathTrackCodecPropsLPCM'

    StreamTrack:
      type: object
      description: |
        One track on an active Stream. The flat fields (`width`,
        `height`, `fps`, `bitrate_kbps`) are a denormalized summary
        of the discriminated `codec_props` detail.
      required: [kind, codec]
      properties:
        kind:
          $ref: '#/components/schemas/StreamTrackKind'
        codec:
          type: string
        width:
          type: integer
        height:
          type: integer
        fps:
          type: number
          format: double
        bitrate_kbps:
          type: integer
        codec_props:
          $ref: '#/components/schemas/APIPathTrackCodecProps'

    TransportConnection:
      type: object
      description: |
        One RTSP-level transport connection. Folded into
        `Stream.protocol_specific.transport_connections[]` for
        RTSP / RTSPS streams. Replaces the standalone RTSPConn /
        RTSPSConn endpoints in the legacy /v3 surface.
      required: [id, remote_addr, bytes_inbound, bytes_outbound]
      properties:
        id:
          type: string
          format: uuid
        remote_addr:
          type: string
          x-classification: pii
          description: |
            Peer address. Replaced with the literal `redacted` on
            responses (canonical-divergence D5).
        tunnel:
          type: string
        bytes_inbound:
          type: integer
          format: int64
        bytes_outbound:
          type: integer
          format: int64

    ProtocolSpecificRTSP:
      type: object
      description: |
        protocol_specific variant for `protocol=rtsp` /
        `protocol=rtsps`. The TLS distinction lives on
        `Stream.protocol`; this shape is shared.
      required:
        - transport
        - profile
        - rtp_packets_inbound
        - rtp_packets_lost
        - rtp_packets_in_error
        - rtp_jitter
        - rtcp_packets_inbound
        - rtcp_packets_in_error
        - rtp_packets_outbound
        - rtp_packets_reported_lost
        - rtp_packets_discarded
        - rtcp_packets_outbound
      properties:
        transport:
          $ref: '#/components/schemas/RTSPTransport'
        profile:
          type: string
        transport_connections:
          type: array
          items:
            $ref: '#/components/schemas/TransportConnection'
        rtp_packets_inbound:
          type: integer
          format: int64
        rtp_packets_lost:
          type: integer
          format: int64
        rtp_packets_in_error:
          type: integer
          format: int64
        rtp_jitter:
          type: integer
          format: int64
        rtcp_packets_inbound:
          type: integer
          format: int64
        rtcp_packets_in_error:
          type: integer
          format: int64
        rtp_packets_outbound:
          type: integer
          format: int64
        rtp_packets_reported_lost:
          type: integer
          format: int64
        rtp_packets_discarded:
          type: integer
          format: int64
        rtcp_packets_outbound:
          type: integer
          format: int64

    ProtocolSpecificRTMP:
      type: object
      description: |
        protocol_specific variant for `protocol=rtmp` /
        `protocol=rtmps`.
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/RTMPState'

    ProtocolSpecificSRT:
      type: object
      description: protocol_specific variant for `protocol=srt`.
      required:
        - packets_received
        - packets_lost
        - packets_dropped
        - retransmits
        - encryption_state
      properties:
        packets_received:
          type: integer
          format: int64
        packets_lost:
          type: integer
          format: int64
        packets_dropped:
          type: integer
          format: int64
        retransmits:
          type: integer
          format: int64
        encryption_state:
          type: string

    ProtocolSpecificWebRTC:
      type: object
      description: |
        protocol_specific variant for `protocol=webrtc`. Local /
        remote candidate descriptors carry IP addresses and are PII;
        on responses each candidate string is replaced with the
        literal `redacted`.
      required: [peer_connection_state, ice_state]
      properties:
        peer_connection_state:
          type: string
        ice_state:
          type: string
        local_candidates:
          type: array
          x-classification: pii
          items:
            type: string
        remote_candidates:
          type: array
          x-classification: pii
          items:
            type: string

    ProtocolSpecificHLS:
      type: object
      description: protocol_specific variant for `protocol=hls`.
      required: [outbound_bytes]
      properties:
        outbound_bytes:
          type: integer
          format: int64
        last_request_at:
          type: string
          format: date-time

    ProtocolSpecific:
      description: |
        Discriminated union of per-protocol runtime detail on a
        `Stream`. The discriminator is `protocol` on the parent
        `Stream`, not a field inside this object. Variants:
        ProtocolSpecificRTSP (rtsp+rtsps), ProtocolSpecificRTMP
        (rtmp+rtmps), ProtocolSpecificSRT, ProtocolSpecificWebRTC,
        ProtocolSpecificHLS.
      oneOf:
        - $ref: '#/components/schemas/ProtocolSpecificRTSP'
        - $ref: '#/components/schemas/ProtocolSpecificRTMP'
        - $ref: '#/components/schemas/ProtocolSpecificSRT'
        - $ref: '#/components/schemas/ProtocolSpecificWebRTC'
        - $ref: '#/components/schemas/ProtocolSpecificHLS'

    Stream:
      type: object
      description: |
        Canonical Stream entity per ADR 0009 §"Stream amendments".
        Folds in MediaMTX's per-protocol session and connection
        endpoints. Closes canonical-divergences D9 (`user_id` UUID)
        and D10 (`camera_id` UUID).
      required:
        - id
        - tenant_id
        - camera_id
        - recording_server_id
        - protocol
        - direction
        - state
        - remote_addr
        - bytes_inbound
        - bytes_outbound
        - frames_discarded_outbound
        - started_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        camera_id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        protocol:
          $ref: '#/components/schemas/StreamProtocol'
        direction:
          $ref: '#/components/schemas/StreamDirection'
        state:
          $ref: '#/components/schemas/StreamState'
        remote_addr:
          type: string
          x-classification: pii
          description: |
            Peer address. Replaced with the literal `redacted` on
            responses (canonical-divergence D5).
        user_id:
          type: string
          format: uuid
        query_string:
          type: string
          x-classification: sensitive
          description: |
            Query portion of the request URL. Subject to
            pre-serialization redaction: values for keys matching
            `token`, `password`, `key`, or `secret`
            (case-insensitive substring) are replaced with the
            literal `redacted`. Closes canonical-divergence D12.
        bytes_inbound:
          type: integer
          format: int64
        bytes_outbound:
          type: integer
          format: int64
        frames_discarded_outbound:
          type: integer
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/StreamTrack'
        protocol_specific:
          $ref: '#/components/schemas/ProtocolSpecific'
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time

    StreamList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Stream'

    # ----- RecordingSegment + Recording ---------------------------

    RecordingSegmentTrack:
      type: object
      required: [kind, codec]
      properties:
        kind:
          $ref: '#/components/schemas/StreamTrackKind'
        codec:
          type: string

    RecordingSegment:
      type: object
      description: |
        Canonical 17-field RecordingSegment entity. Adds
        `recording_id` per ADR 0009. The recorder-local on-disk
        `path` field documented in `domain-model.md` is excluded
        from API responses by classification rule. Closes
        canonical-divergence D8.
      required:
        - id
        - tenant_id
        - site_id
        - recording_server_id
        - camera_id
        - volume_id
        - policy_id
        - recording_id
        - started_at
        - ended_at
        - duration
        - container
        - size_bytes
        - state
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        camera_id:
          type: string
          format: uuid
        volume_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        recording_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        duration:
          type: string
        container:
          $ref: '#/components/schemas/RecordingSegmentContainer'
        size_bytes:
          type: integer
          format: int64
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/RecordingSegmentTrack'
        checksum:
          type: string
        state:
          $ref: '#/components/schemas/RecordingSegmentState'
        created_at:
          type: string
          format: date-time

    RecordingSegmentList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/RecordingSegment'

    Recording:
      type: object
      description: |
        Canonical Recording entity introduced inline by ADR 0009. A
        continuous span of recorded footage on one camera, composed
        of one or more `RecordingSegment`s. The client/scrub
        primitive. List responses omit `segments`; GET-by-id
        includes them.
      required:
        - id
        - tenant_id
        - site_id
        - camera_id
        - recording_server_id
        - started_at
        - state
        - duration
        - byte_size
        - segment_count
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        camera_id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        policy_id:
          type: string
          format: uuid
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/RecordingState'
        failure_reason:
          type: string
          description: |
            Required when `state == failed`; null otherwise.
        duration:
          type: string
        byte_size:
          type: integer
          format: int64
        segment_count:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        segments:
          type: array
          description: |
            Embedded only on the GET-by-id response per ADR 0009 §D5;
            the list endpoint omits this field.
          items:
            $ref: '#/components/schemas/RecordingSegment'

    RecordingList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Recording'

    ClipState:
      type: string
      enum: [requested, preparing, ready, failed, expired, deleted]

    ClipContainer:
      type: string
      enum: [mp4, fmp4, mpegts]

    Clip:
      type: object
      description: |
        Canonical Clip entity per platform/docs/domain-model.md. A
        user-defined, persistent reference to a time range of recorded
        media. The recorder is authoritative for preparing the export
        artifact (stitching source segments, writing the export file,
        computing checksums, serving the download) and for retaining
        the source segments for the lifetime of the clip — overriding
        normal policy retention.

        Pre-MS phase: `requested_by` is the empty string in this
        build because there is no on-recorder User authoritative
        source. Once the Management Server lands, this field carries
        the canonical user id of the requester.

        Recorder-internal `export_path` and `download_token_ref`
        fields exist on the canonical entity but never appear in this
        wire shape per the data-classification rules.
      required:
        - id
        - tenant_id
        - site_id
        - recording_server_id
        - camera_id
        - requested_by
        - label
        - range_started_at
        - range_ended_at
        - duration
        - requested_at
        - state
        - container
        - source_segment_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        camera_id:
          type: string
          format: uuid
        requested_by:
          type: string
          description: |
            Canonical User id of the requester. Empty string in the
            pre-MS phase (no recorder-side User authoritative source).
        label:
          type: string
        description:
          type: string
        range_started_at:
          type: string
          format: date-time
        range_ended_at:
          type: string
          format: date-time
        duration:
          type: string
        requested_at:
          type: string
          format: date-time
        prepared_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: |
            Null means "retain until explicitly deleted."
        state:
          $ref: '#/components/schemas/ClipState'
        failure_reason:
          type: string
        container:
          $ref: '#/components/schemas/ClipContainer'
        size_bytes:
          type: integer
          format: int64
        checksum:
          type: string
          description: Algorithm-prefixed, e.g. `sha256:...`.
        source_segment_ids:
          type: array
          items:
            type: string
            format: uuid
        notice:
          type: string
          description: |
            Operational note. Reserved for surfacing future
            preparation caveats; empty in this build, where
            preparation produces a real fmp4-to-mp4 remux.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ClipCreateRequest:
      type: object
      required:
        - camera_id
        - label
        - range_started_at
        - range_ended_at
      properties:
        camera_id:
          type: string
          format: uuid
        label:
          type: string
        description:
          type: string
        range_started_at:
          type: string
          format: date-time
        range_ended_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        requested_by:
          type: string
          description: |
            Forward-compatible: stored as-is on the Clip. Empty
            string in the pre-MS phase.

    ClipList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Clip'
            notice:
              type: string

    PlaybackHandle:
      type: object
      description: |
        Playback connection material returned by
        `GET /v1/recordings/{id}/playback`. The actual stream comes
        through the existing media protocols; this endpoint just
        hands the client a URL bounded by `expires_at`.

        Authentication note: per ADR 0011 the recorder does not issue
        tokens. Clients reuse the user JWT they already hold from
        Cloud/MS when fetching the URL — the playback `/get` endpoint
        validates via the existing auth.Manager. ADR 0009 §D5 listed a
        `token` field on this shape; that field has been dropped on
        the wire to keep the contract honest with ADR 0011.
      required: [url, expires_at]
      properties:
        url:
          type: string
        expires_at:
          type: string
          format: date-time
          description: |
            Validity bound on `url`. Clients should re-request the
            playback handle after this instant.

    # ----- Event ----------------------------------------------------

    Event:
      type: object
      description: |
        Canonical Event entity. `kind` is a closed, versioned
        vocabulary (e.g. `camera.offline`, `segment.write_failed`,
        `storage.volume_full`).
      required:
        - id
        - recording_server_id
        - tenant_id
        - site_id
        - occurred_at
        - kind
        - severity
        - subject_kind
        - subject_id
        - message
      properties:
        id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        kind:
          type: string
        severity:
          $ref: '#/components/schemas/EventSeverity'
        subject_kind:
          $ref: '#/components/schemas/EventSubjectKind'
        subject_id:
          type: string
          format: uuid
        message:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        correlation_id:
          type: string

    EventList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Event'
            notice:
              type: string
              description: |
                Operational note. Phase 2D ships the buffer empty
                until per-producer wiring lands; in that case
                `notice` carries an "events store not yet wired"
                message so clients can distinguish "no events match"
                from "no producers wired."

    # ----- Audit ----------------------------------------------------

    AuditEmitterKind:
      type: string
      enum: [cloud, management_server, recording_server]
      description: |
        The tier that authored the audit entry. Per ADR 0006 D2, each
        tier emits its own observed actions; entries authored by the
        recorder always have `recording_server`.

    AuditActorKind:
      type: string
      enum: [cloud_user, local_user, service_account, system, unauthenticated]
      description: |
        Kind of principal whose action is being audited.
        `unauthenticated` covers failed-auth attempts before a
        principal is resolved.

    AuditOutcome:
      type: string
      enum: [success, failure, denied]

    AuditLogEntry:
      type: object
      description: |
        Tamper-evident record of a security- or compliance-relevant
        action per ADR 0006. Entries form per-emitter SHA-256 hash
        chains via `prev_hash` / `entry_hash`.
      required:
        - id
        - tenant_id
        - occurred_at
        - recorded_at
        - emitter_kind
        - emitter_id
        - actor_kind
        - action
        - outcome
        - resource_kind
        - prev_hash
        - entry_hash
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        site_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
        recorded_at:
          type: string
          format: date-time
        emitter_kind:
          $ref: '#/components/schemas/AuditEmitterKind'
        emitter_id:
          type: string
        actor_kind:
          $ref: '#/components/schemas/AuditActorKind'
        actor_id:
          type: string
        action:
          type: string
          description: |
            Canonical, namespaced action vocabulary per ADR 0006 D7
            (e.g. `auth.login`, `auth.failed_login`, `config.applied`,
            `policy.applied`, `pairing.consumed`,
            `breakglass.activated`).
        outcome:
          $ref: '#/components/schemas/AuditOutcome'
        resource_kind:
          type: string
        resource_id:
          type: string
        session_id:
          type: string
          format: uuid
        correlation_id:
          type: string
          format: uuid
        source_ip:
          type: string
        client_fingerprint:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
          description: |
            Per-action attributes. Per ADR 0006 D7 rule B these must
            not contain PII or Credential values inline; producers
            redact at emission time.
        prev_hash:
          type: string
          description: |
            Hex-encoded SHA-256 of the previous entry on this emitter's
            chain. The chain origin is 64 zero hex characters per
            ADR 0006 D3.
        entry_hash:
          type: string
          description: |
            Hex-encoded SHA-256 of the canonical-JSON serialization of
            this entry with `entry_hash` cleared. The chain link.

    AuditLogEntryList:
      allOf:
        - $ref: '#/components/schemas/PaginationListWrapper'
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AuditLogEntry'

    # ----- Health ---------------------------------------------------

    HealthStatusStorage:
      type: object
      required: [volume_id, used_pct, status]
      properties:
        volume_id:
          type: string
          format: uuid
        used_pct:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/HealthStatusVolumeState'

    HealthStatusNetwork:
      type: object
      required: [management_server_reachable, cloud_reachable]
      properties:
        management_server_reachable:
          type: boolean
        cloud_reachable:
          type: boolean
        last_sync_at:
          type: string
          format: date-time

    HealthStatus:
      type: object
      description: |
        One snapshot, current state only per ADR 0009 §D2. Pre-MS
        the network reachability flags default to `false` until the
        pairing client lands.

        cpu_pct, mem_pct, and bandwidth are host-level — saturated
        cpu_pct reads ~100 regardless of core count, mem_pct is
        used-RAM across every process on the box, bandwidth sums
        across every non-loopback NIC the kernel reports. /v1/health
        answers the fleet-monitoring question ("is this box hot?"),
        not "is the recorder process the bottleneck?" — the latter
        belongs on the Prometheus surface.
      required:
        - id
        - recording_server_id
        - tenant_id
        - reported_at
        - cpu_pct
        - mem_pct
        - uptime
        - cameras_total
        - cameras_recording
        - cameras_offline
        - network
        - bandwidth
        - overall
      properties:
        id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        reported_at:
          type: string
          format: date-time
        cpu_pct:
          type: number
          format: double
          description: |
            Host-wide CPU percent (gopsutil cpu.Percent, percpu=false).
            Saturated reads ~100 regardless of core count. The first
            reading after process start returns 0 (no previous
            CPU-time delta to compare against).
        mem_pct:
          type: number
          format: double
          description: |
            Host-wide used-memory percent: in-use RAM across every
            process on the box, divided by total RAM (gopsutil
            VirtualMemory().UsedPercent). Falls back to the Go
            runtime's HeapInuse / HeapSys ratio when the OS reading
            isn't available.
        uptime:
          type: string
        cameras_total:
          type: integer
        cameras_recording:
          type: integer
        cameras_offline:
          type: integer
        storage:
          type: array
          items:
            $ref: '#/components/schemas/HealthStatusStorage'
        network:
          $ref: '#/components/schemas/HealthStatusNetwork'
        bandwidth:
          $ref: '#/components/schemas/HealthStatusBandwidth'
        overall:
          $ref: '#/components/schemas/HealthStatusOverall'

    HealthStatusBandwidth:
      type: object
      description: |
        Host-level network throughput, summed across every
        non-loopback interface the kernel reports (gopsutil
        IOCounters(pernic=true) — kernel-maintained per-NIC
        counters, not process-scoped). Bytes-per-second over the
        wall-clock interval since the previous /v1/health request.
        The first reading after process start primes the sampler
        and reports zero on both fields.
      required: [rx_bps, tx_bps]
      properties:
        rx_bps:
          type: number
          format: double
        tx_bps:
          type: number
          format: double

    # ----- StorageVolume -------------------------------------------

    StorageVolume:
      type: object
      description: |
        Canonical StorageVolume entity. Read-only at this surface;
        bootstrap configuration (mount path, kind, priority) lives
        in `/v1/recorder/config`.
      required:
        - id
        - recording_server_id
        - mount_path
        - kind
        - capacity_bytes
        - used_bytes
        - reserved_bytes
        - status
        - last_checked_at
        - priority
      properties:
        id:
          type: string
          format: uuid
        recording_server_id:
          type: string
          format: uuid
        mount_path:
          type: string
          x-classification: sensitive
          description: |
            Absolute mount path. Sensitive per data-classification.md
            (filesystem layout reveals deployment topology).
        kind:
          $ref: '#/components/schemas/StorageVolumeKind'
        capacity_bytes:
          type: integer
          format: int64
        used_bytes:
          type: integer
          format: int64
        reserved_bytes:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/StorageVolumeStatus'
        last_checked_at:
          type: string
          format: date-time
        priority:
          type: integer
        write_bytes_per_second:
          type: integer
          format: int64
          nullable: true
          description: |
            Recent write throughput, computed by the recorder from
            used-bytes deltas across successive
            `/v1/storage-volumes` calls. Optional; populated only
            after the second sample arrives. Negative deltas
            (retention pruning) clamp to zero so the field
            surfaces only positive write activity.
        smart:
          $ref: '#/components/schemas/StorageVolumeSMART'

    StorageVolumeSMART:
      type: object
      nullable: true
      description: |
        Best-effort drive metadata sourced from a `smartctl -j`
        shell-out, 60-second per-mount cache. Optional — absent
        on hosts without `smartmontools`, when the mount-path
        doesn't resolve to a block device, or when the smartctl
        invocation failed for any reason. Every sub-field is
        independently optional so a partial smartctl response
        still yields a partial block.
      properties:
        device:
          type: string
          x-classification: sensitive
          description: |
            Block-device path (`/dev/sda`, `\\.\PHYSICALDRIVE0`, …).
            Sensitive: filesystem layout reveals deployment
            topology; same redaction posture as `mount_path`.
        model_family:
          type: string
        model_name:
          type: string
        serial_number:
          type: string
          x-classification: restricted
          description: |
            Drive serial uniquely identifies hardware; never
            include in non-admin views. Restricted per
            data-classification.md.
        power_on_hours:
          type: integer
          format: int64
        health_passed:
          type: boolean
        temperature_c:
          type: integer

    StorageVolumeList:
      type: object
      description: |
        Storage-volume list. Pagination is not currently applied
        because the volume count is small per recorder; only
        `item_count` and `items` are emitted.
      required: [item_count, items]
      properties:
        item_count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorageVolume'

    # ----- Configuration UI surfaces ------------------------------

    RecorderIdentity:
      type: object
      description: |
        Recorder bootstrap identity for the configuration UI's
        identity card. Hostname and timezone are read-only at this
        surface (changing them is the host OS's job, not the
        recorder process's). Location is operator-set (PATCH
        accepts only `location`). Firmware is build-time stamped.
      required:
        - tenant_id
        - hostname
        - location
        - timezone
        - firmware_version
      properties:
        tenant_id:
          type: string
          format: uuid
        hostname:
          type: string
        location:
          type: string
          description: |
            Operator-set free-form label (e.g. "Warehouse A — Rack 2").
            Empty string when not configured.
        timezone:
          type: string
          description: Recorder process's local-zone abbreviation (UTC, CET, …).
        firmware_version:
          type: string

    RecorderIdentityPatch:
      type: object
      description: |
        Identity PATCH body. Only `location` is patchable; any other
        patchable-field claim returns 400. `tenant_id` may be
        echoed back to confirm tenant binding (mismatch returns 403).
      properties:
        tenant_id:
          type: string
          format: uuid
        location:
          type: string

    NetworkInfo:
      type: object
      description: |
        Cross-platform network information for the configuration
        UI's Network page. gopsutil-driven; works on Linux, macOS,
        Windows, and BSD. DNS resolvers are parsed from
        /etc/resolv.conf on unix and omitted on Windows.
      required: [os, platform, hostname, interfaces, bandwidth]
      properties:
        os:
          type: string
          description: GOOS (linux / darwin / windows / freebsd / …).
        platform:
          type: string
          description: |
            OS distribution string (Ubuntu 22.04, macOS 14.5, …),
            empty when gopsutil host.Info() is unavailable.
        hostname:
          type: string
        interfaces:
          type: array
          items:
            $ref: '#/components/schemas/NetworkInterface'
        dns:
          type: array
          items:
            type: string
          description: |
            DNS resolver IPs in /etc/resolv.conf order. Empty
            on Windows (no equivalent file path).
        bandwidth:
          $ref: '#/components/schemas/BandwidthStats'

    NetworkInterface:
      type: object
      required: [name, hardware_addr, mtu, is_up, is_loopback]
      properties:
        name:
          type: string
        hardware_addr:
          type: string
          description: MAC address as `aa:bb:cc:dd:ee:ff`.
        mtu:
          type: integer
        is_up:
          type: boolean
        is_loopback:
          type: boolean
        addresses:
          type: array
          items:
            type: string
          description: CIDR strings (`192.0.2.10/24`, `fe80::1/64`, …).

    BandwidthStats:
      type: object
      description: |
        Bandwidth samples + rolling-window stats. now_* are the
        latest /v1/health.bandwidth reading; peak_bps and avg_bps
        are computed across a 24h history the bandwidth sampler
        keeps in-memory (one entry per /v1/health request).
      required: [now_rx_bps, now_tx_bps, peak_bps, avg_bps, window_sec]
      properties:
        now_rx_bps:
          type: number
          format: double
        now_tx_bps:
          type: number
          format: double
        peak_bps:
          type: number
          format: double
        avg_bps:
          type: number
          format: double
        window_sec:
          type: integer

    CameraProbeRequest:
      type: object
      required: [source_url]
      properties:
        source_url:
          type: string
          description: |
            Source URL to probe (`rtsp://host:port/path`,
            `rtmp://…`, `srt://…`, `http(s)://…`). Userinfo is
            stripped before logging.

    CameraProbeResponse:
      type: object
      required: [reachable, host, port, latency_ms]
      properties:
        reachable:
          type: boolean
        host:
          type: string
        port:
          type: integer
        latency_ms:
          type: integer
          format: int64
        reason:
          type: string
          description: Failure reason; absent when reachable=true.

    PingRequest:
      type: object
      required: [target]
      properties:
        target:
          type: string
          description: |
            Target host or `host:port` or full URL. When no port is
            given a sensible default is used per scheme (rtsp:554,
            rtmp:1935, https:443, …).
        count:
          type: integer
          default: 4
          description: Number of probes; capped at 20 server-side.

    PingResponse:
      type: object
      required: [target, samples, avg_ms, loss_pct]
      properties:
        target:
          type: string
        samples:
          type: array
          items:
            $ref: '#/components/schemas/PingSample'
        avg_ms:
          type: number
          format: double
        loss_pct:
          type: number
          format: double

    PingSample:
      type: object
      required: [seq, ok, latency_ms]
      properties:
        seq:
          type: integer
        ok:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        reason:
          type: string

    NtpRequest:
      type: object
      properties:
        server:
          type: string
          default: pool.ntp.org

    NtpResponse:
      type: object
      required: [server, ok, offset_ms]
      properties:
        server:
          type: string
        ok:
          type: boolean
        offset_ms:
          type: number
          format: double
          description: |
            Local-vs-server offset, computed as the SNTP standard
            ((serverTime - t1) + (serverTime - t4)) / 2.
        reason:
          type: string

    RTSPProbeResponse:
      type: object
      required: [results, ok_count, total]
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/RTSPProbeResult'
        ok_count:
          type: integer
        total:
          type: integer

    RTSPProbeResult:
      type: object
      required: [path, url, reachable, latency_ms]
      properties:
        path:
          type: string
        url:
          type: string
          description: Source URL with userinfo redacted.
        reachable:
          type: boolean
        latency_ms:
          type: integer
          format: int64
        reason:
          type: string

    # ----- Recorder-localized escape hatch wire shapes ------------

    RecorderConfig:
      type: object
      description: |
        Recorder operational config (logging, timeouts, server bind
        addresses, TLS material refs, metrics/pprof/playback
        servers, recorder-level shell hooks). Recorder-localized
        escape hatch per ADR 0009 §D6 — covers ~95% of MediaMTX's
        `GlobalConf`. **Not platform-canonical**: shape mirrors the
        upstream `conf.GlobalConf` 1:1 with credential redaction
        applied on read; the JSON keys retain MediaMTX-lineage
        camelCase (`logLevel`, `runOnConnect`, `apiAddress`, …).
        Documented as opaque-shape here because the field set is
        large (~80 keys) and recorder-internal; full per-field
        reference lives in the recorder's own configuration docs.

        Includes per-volume bootstrap overrides under
        `recordingVolumes` (per ADR 0009 §D5): a map keyed by mount
        path whose values carry an optional `priority` integer. When
        set, that priority replaces the synthesized mount-path-sort
        index surfaced by `/v1/storage-volumes`; when absent, the
        synthesized fallback is used.
      additionalProperties: true
      x-classification: sensitive

    CameraDefaults:
      type: object
      description: |
        Default fields applied at camera creation. Recorder-localized
        escape hatch per ADR 0009 §D6. Recording-policy fields
        (`record`, `recordPath`, `recordFormat`, `recordPartDuration`,
        `recordMaxPartSize`, `recordSegmentDuration`,
        `recordDeleteAfter`) are stripped from responses and rejected
        with 400 in PATCH bodies — the canonical mechanism for shared
        recording behavior is `RecordingPolicy` at
        `/v1/recording-policies`. Shape mirrors `conf.OptionalPath`
        with camelCase JSON keys; documented as opaque-shape because
        the field set is large.
      additionalProperties: true

    HLSMuxer:
      type: object
      description: |
        Per-camera HLS muxer state. Recorder-internal observability
        per ADR 0009 §D6. Shape mirrors the upstream MediaMTX
        `APIHLSMuxer` 1:1 (camelCase JSON keys); documented as
        opaque-shape here because the canonical model has no place
        for muxer state.
      additionalProperties: true
      properties:
        path:
          type: string
        created:
          type: string
          format: date-time
        lastRequest:
          type: string
          format: date-time
        bytesSent:
          type: integer
          format: int64
        tenant_id:
          type: string
          format: uuid

    HLSMuxerList:
      type: object
      required: [item_count, page_count, items]
      properties:
        item_count:
          type: integer
        page_count:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/HLSMuxer'
      description: |
        HLSMuxer list envelope. Pagination keys are snake_case per
        the canonical /v1 convention (`item_count`, `page_count`);
        the query parameter is `items_per_page`. The HLSMuxer item
        shape itself retains MediaMTX-lineage camelCase for the
        muxer-specific fields, per the escape-hatch rule on
        recorder-internal observability shapes.

    RPiCameraSourceConfig:
      type: object
      description: |
        Raspberry Pi camera ~30-field source-config sub-shape.
        Recorder-localized escape hatch per ADR 0009 §D6. Hardware-
        specific (white balance, lens position, autofocus, ISO/
        shutter, RPi-HW-encoder profiles); only meaningful on a
        recorder running on Raspberry Pi hardware. Not part of
        canonical `Camera.source_config`. The `rpiCamera*` fields
        retain camelCase for compatibility with the upstream
        `conf.Path` shape; `tenant_id` is snake_case per the
        canonical /v1 surface convention.
      properties:
        tenant_id:
          type: string
          format: uuid
        rpiCameraCamID:
          type: integer
        rpiCameraSecondary:
          type: boolean
        rpiCameraWidth:
          type: integer
        rpiCameraHeight:
          type: integer
        rpiCameraHFlip:
          type: boolean
        rpiCameraVFlip:
          type: boolean
        rpiCameraBrightness:
          type: number
          format: double
        rpiCameraContrast:
          type: number
          format: double
        rpiCameraSaturation:
          type: number
          format: double
        rpiCameraSharpness:
          type: number
          format: double
        rpiCameraExposure:
          type: string
        rpiCameraAWB:
          type: string
        rpiCameraAWBGains:
          type: array
          items:
            type: number
            format: double
        rpiCameraDenoise:
          type: string
        rpiCameraShutter:
          type: integer
        rpiCameraMetering:
          type: string
        rpiCameraGain:
          type: number
          format: double
        rpiCameraEV:
          type: number
          format: double
        rpiCameraROI:
          type: string
        rpiCameraHDR:
          type: boolean
        rpiCameraTuningFile:
          type: string
        rpiCameraMode:
          type: string
        rpiCameraFPS:
          type: number
          format: double
        rpiCameraAfMode:
          type: string
        rpiCameraAfRange:
          type: string
        rpiCameraAfSpeed:
          type: string
        rpiCameraLensPosition:
          type: number
          format: double
        rpiCameraAfWindow:
          type: string
        rpiCameraFlickerPeriod:
          type: integer
        rpiCameraTextOverlayEnable:
          type: boolean
        rpiCameraTextOverlay:
          type: string
        rpiCameraCodec:
          type: string
        rpiCameraIDRPeriod:
          type: integer
        rpiCameraBitrate:
          type: integer
        rpiCameraHardwareH264Profile:
          type: string
        rpiCameraHardwareH264Level:
          type: string
        rpiCameraSoftwareH264Profile:
          type: string
        rpiCameraSoftwareH264Level:
          type: string
        rpiCameraMJPEGQuality:
          type: integer

    CameraHooks:
      type: object
      description: |
        Per-camera shell hooks. Recorder-localized escape hatch per
        ADR 0009 §D6. Recorder-script behavior the platform can't
        sensibly reason about across tiers. Strings are at minimum
        Sensitive per data-classification.md — they may carry
        credentials if the operator embeds them in shell commands.
        On both reads and writes the recorder scans for credential
        markers and emits a Warn log; hook contents are not redacted
        on read because the operator who set them needs to be able
        to read them back to edit them. The `runOn*` fields retain
        camelCase for compatibility with the upstream `conf.Path`
        shape; `tenant_id` is snake_case per the canonical /v1
        surface convention.
      x-classification: sensitive
      properties:
        tenant_id:
          type: string
          format: uuid
        runOnInit:
          type: string
        runOnInitRestart:
          type: boolean
        runOnDemand:
          type: string
        runOnDemandRestart:
          type: boolean
        runOnDemandStartTimeout:
          type: string
        runOnDemandCloseAfter:
          type: string
        runOnUnDemand:
          type: string
        runOnReady:
          type: string
        runOnReadyRestart:
          type: boolean
        runOnNotReady:
          type: string
        runOnRead:
          type: string
        runOnReadRestart:
          type: boolean
        runOnUnread:
          type: string
        runOnRecordSegmentCreate:
          type: string
        runOnRecordSegmentComplete:
          type: string

paths:

  # ===== Info =====================================================

  /v1/info:
    get:
      tags: [Info]
      summary: Recorder runtime info.
      description: |
        Returns recorder-self-reported version, start time, and the
        bound `tenant_id`. Same role as the legacy `/v3/info`; the
        URL prefix change is the only difference.
      responses:
        '200':
          description: Info response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Auth =====================================================

  /v1/auth/refresh-issuer-material:
    post:
      tags: [Auth]
      summary: Force the recorder's auth manager to refresh cached issuer material.
      description: |
        Renamed mechanism-neutrally from the legacy
        `/v3/auth/jwks/refresh` per ADR 0009 §D7. ADR 0011 picked
        JWT/JWKS for user-facing flows and mTLS X.509 for service-to-
        service connections; the mechanism-neutral name was retained
        so additional issuer-material kinds (e.g., the trust roots
        for mTLS validation) can flow through this endpoint without
        a rename. Today the implementation refreshes the JWKS cache.
      responses:
        '200':
          description: Refresh accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Cameras ==================================================

  /v1/cameras:
    get:
      tags: [Cameras]
      summary: List cameras.
      description: |
        Returns canonical Camera entities including the small
        `runtime` block per ADR 0009 §D3. Sorted deterministically
        by recorder-internal path-name (UUID round-trip stable).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
      responses:
        '200':
          description: Camera list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Cameras]
      summary: Create a camera.
      description: |
        Server issues the canonical UUID per ADR 0009 §D4. The
        `name` field is required. The `tenant_id` field on the body
        is optional; if present and mismatched against the
        recorder's bound tenant, the recorder returns 403.
        Server-managed fields (`id`, `runtime`, `created_at`,
        `updated_at`) on the body are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Camera'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Camera with that name already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/cameras/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Cameras]
      summary: Get a camera by canonical UUID.
      responses:
        '200':
          description: Camera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          description: Invalid camera id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Cameras]
      summary: Partially update a camera.
      description: |
        Partial-update semantics: only fields present in the body are
        applied. The `runtime` block is read-only (writes are
        ignored). Body's `tenant_id`, if present, must match the
        recorder's bound tenant or the request returns 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Camera'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Cameras]
      summary: Replace a camera.
      description: |
        Full-replace semantics: every conf-side field is overwritten
        from the body. Server-managed fields (`id`, `runtime`,
        `created_at`) are preserved. Body's `tenant_id`, if present,
        must match.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Camera'
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Camera'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Cameras]
      summary: Delete a camera.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Invalid camera id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/cameras/probe:
    post:
      tags: [Cameras]
      summary: Pre-flight reachability check for a candidate source URL.
      description: |
        Parses the source URL (rtsp/rtsps/rtmp/rtmps/srt/http/https
        with scheme-default port fallback when no port is given),
        attempts a TCP dial against host:port with a 5-second
        timeout, and returns reachability + handshake-latency.
        Doesn't open the actual stream — for that you'd need to
        consume a license, pick a codec, and start a recorder
        pipeline; for a config-UI pre-flight, "is the host reachable
        on the right port" is the useful question.

        Cross-platform via stdlib `net.Dialer` — same behavior on
        Linux, macOS, Windows, BSD.

        Admin-gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraProbeRequest'
      responses:
        '200':
          description: |
            Probe completed. `reachable` indicates the outcome;
            unreachable cases populate `reason` with the dial
            error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraProbeResponse'
        '400':
          description: Invalid request (missing source_url, unparsable, unsupported scheme).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== RecordingPolicies =======================================

  /v1/recording-policies:
    get:
      tags: [RecordingPolicies]
      summary: List recording policies.
      description: |
        Returns canonical RecordingPolicy entries. Pre-MS the
        recorder lazily synthesizes policies from per-camera
        recording fields on first access; per-restart persistence is
        intentional (synthesis re-runs on next start).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
      responses:
        '200':
          description: Policy list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicyList'
    post:
      tags: [RecordingPolicies]
      summary: Create a recording policy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPolicy'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicy'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recording-policies/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [RecordingPolicies]
      summary: Get a recording policy.
      responses:
        '200':
          description: Policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicy'
        '400':
          description: Invalid id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [RecordingPolicies]
      summary: Partially update a recording policy.
      description: |
        When the patch flips `enabled`, every camera that references
        this policy has its underlying recording state toggled
        accordingly; the change is applied immediately to the
        recorder's per-path `Record` flag.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingPolicy'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPolicy'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [RecordingPolicies]
      summary: Delete a recording policy.
      description: |
        Returns 409 Conflict if any Camera still references the
        policy via `Camera.recording_policy_id`. Per ADR 0009 §D5.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Policy still referenced by one or more cameras.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Streams ==================================================

  /v1/streams:
    get:
      tags: [Streams]
      summary: List active runtime streams.
      description: |
        Folds 25 protocol-specific endpoints from the legacy /v3
        surface into a single canonical surface per ADR 0009 §D5.
        Per-protocol detail lives on the response in
        `protocol_specific`. Filters are AND-combined.

        `remote_addr` and `query_string` are redacted on output per
        canonical-divergences D5 / D12.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: protocol
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StreamProtocol'
        - name: camera_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: direction
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StreamDirection'
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StreamState'
      responses:
        '200':
          description: Stream list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/streams/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Streams]
      summary: Get a single active stream by canonical UUID.
      description: |
        Searches every protocol cluster for the UUID; first match
        wins. The response's `protocol_specific` payload is keyed by
        the matched cluster.
      responses:
        '200':
          description: Stream detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stream'
        '400':
          description: Invalid stream id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stream not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Streams]
      summary: Terminate (kick) an active stream.
      description: |
        DELETE on a Stream means **terminate the session**, not
        delete a stored record — the resource is ephemeral, and
        DELETE is the canonical kick verb for a runtime resource.
      responses:
        '200':
          description: Kicked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Invalid stream id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Stream not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Recordings ===============================================

  /v1/recordings:
    get:
      tags: [Recordings]
      summary: List recordings.
      description: |
        Returns canonical Recording entities. List responses **omit**
        the embedded `segments` array per ADR 0009 §D5 — fetch a
        single recording for the segment list.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: camera_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RecordingState'
        - name: started_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Recording list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recordings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Recordings]
      summary: Get a recording with embedded segments.
      description: |
        Embeds the segment list per ADR 0009 §D5. Each segment has
        its recorder-local `path` field scrubbed before serialization.
      responses:
        '200':
          description: Recording detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recording'
        '400':
          description: Invalid recording id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recording not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Recordings]
      summary: Delete a recording and all of its segments.
      description: |
        Cascades through every `RecordingSegment` belonging to the
        Recording, removing each file from disk. Equivalent to a
        client iterating `DELETE /v1/recording-segments/{id}` for each
        segment, but issued in a single call so clients don't race
        against the recorder rotating new segments mid-iteration on
        an active Recording.

        Active Recordings are deletable; the in-flight segment is
        removed along with the rest. The recorder's record loop will
        discover the missing file on its next write and the
        `segment.write_failed` Event surfaces the condition.

        Per ADR 0009 §D5 the Recording's canonical lifecycle is to
        transition to `state=deleted` and persist as a tombstone for
        audit; the recorder's current synthesis-from-disk model has
        no persistent Recording row, so the post-DELETE GET returns
        404 instead. Persistent Recording storage is its own
        follow-up; the audit-chain entry written by this handler is
        the durable record today.

        Partial failure (one or more segments couldn't be removed
        for a non-`ENOENT` reason) returns 500 with a per-segment
        error list; the cache is invalidated regardless so a follow-
        up GET reflects whatever survived.
      responses:
        '200':
          description: Recording (and all segments) deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Invalid recording id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recording not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Partial failure during cascade; per-segment errors in body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recordings/{id}/playback:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Recordings]
      summary: Issue a playback handle for a recording.
      description: |
        Returns playback connection material (URL + `expires_at`
        validity bound). The actual stream comes through the existing
        media protocols, not over this endpoint. Per ADR 0011 the
        recorder does not issue tokens — clients reuse the user JWT
        they already hold from Cloud/MS when fetching the URL; the
        playback `/get` endpoint authenticates via the existing
        `auth.Manager`.
      responses:
        '200':
          description: Playback handle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackHandle'
        '400':
          description: Invalid recording id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recording not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== RecordingSegments =======================================

  /v1/recording-segments:
    get:
      tags: [RecordingSegments]
      summary: List recording segments.
      description: |
        Storage-ops listing. The `started_*` filters are footage
        time; the `created_*` filters are segment-write time. Both
        pairs are useful for distinct workflows (timeline scrub vs
        storage-growth analysis).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: recording_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: camera_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: volume_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RecordingSegmentState'
        - name: started_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: created_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Segment list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSegmentList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recording-segments/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [RecordingSegments]
      summary: Get a recording segment.
      description: |
        Recorder-local `path` is scrubbed from the response per the
        data-classification rule.
      responses:
        '200':
          description: Segment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingSegment'
        '400':
          description: Invalid segment id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Segment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [RecordingSegments]
      summary: Delete a recording segment file.
      description: |
        UUID-keyed replacement for the legacy
        `DELETE /v3/recordings/deletesegment` (which keyed by
        `?path=...&start=...`). Removes the on-disk segment file.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Invalid segment id, or filesystem error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Segment not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Clips ====================================================

  /v1/clips:
    get:
      tags: [Clips]
      summary: List clips.
      description: |
        Returns the recorder's authoritative view of clips. Filtered
        by `camera_id` and/or `state`.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: camera_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ClipState'
      responses:
        '200':
          description: Clip list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClipList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Clips]
      summary: Create a clip and start asynchronous preparation.
      description: |
        Creates a clip in `requested` state and spawns a preparation
        worker. The worker transitions the clip through `preparing`
        to `ready` (or `failed`); poll GET /v1/clips/{id} for the
        final state.

        Source segments are resolved at create time and pinned: the
        recorder will not prune any RecordingSegment listed in the
        clip's `source_segment_ids` while the clip is in
        requested/preparing/ready state, even when those segments
        are older than the policy retention window.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClipCreateRequest'
      responses:
        '201':
          description: Clip created (preparation may still be running).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        '400':
          description: |
            Invalid request body, invalid range, or no recording
            segments overlap the requested range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/clips/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Clips]
      summary: Get a clip.
      responses:
        '200':
          description: Clip detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Clip'
        '400':
          description: Invalid clip id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Clips]
      summary: Soft-delete a clip.
      description: |
        Sets `state` to `deleted`, releasing the source-segment pins
        the clip held. The export artifact is removed best-effort.
        The clip row stays queryable (state=deleted) for audit per
        the platform's soft-delete convention.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Invalid clip id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/clips/{id}/download:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Clips]
      summary: Download the stitched clip bytes.
      description: |
        Returns the stitched export artifact with
        `Content-Type: video/mp4`. The clip must be in `ready`
        state; other states return 409.

        Authentication: per ADR 0011 the recorder does not issue
        per-download tokens; this endpoint is gated by the same JWT
        validation middleware as the rest of the `/v1` surface.
      responses:
        '200':
          description: Stitched clip bytes.
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid clip id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Clip not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Clip is not in `ready` state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Events ===================================================

  /v1/events:
    get:
      tags: [Events]
      summary: List events.
      description: |
        Returns canonical Event entries. Multi-value `kind`
        filtering is supported (`?kind=a&kind=b`). The `severity`
        filter accepts either a bare severity or the `>=warning`
        form (semantics: events at or above this rank pass through).

        Wired producer kinds: camera.online, camera.offline,
        auth.failed_login, config.applied, policy.applied,
        segment.write_failed. Unwired (queued for follow-up):
        auth.session_started (ADR 0011 unblocks the kind via
        jti-keyed session lifecycle; recorder still needs jti-dedup
        tracking) and storage.volume_full (sits deeper in the cleaner
        subsystem). An empty list response surfaces a top-level
        `notice` field describing the producer state.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: camera_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: started_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: started_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          description: Multi-value; may be repeated.
          schema:
            type: array
            items:
              type: string
        - name: severity
          in: query
          required: false
          schema:
            type: string
        - name: severity_min
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventSeverity'
        - name: subject_kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EventSubjectKind'
        - name: subject_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event list (possibly with `notice`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Events]
      summary: Get an event by id.
      responses:
        '200':
          description: Event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Invalid id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Event not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Audit ====================================================

  /v1/audit:
    get:
      tags: [Audit]
      summary: List audit log entries.
      description: |
        Returns AuditLogEntry rows from the recorder's in-memory
        audit chain per ADR 0006. The chain is append-only — there
        is no POST/PATCH/DELETE on this surface. Each entry's
        `prev_hash` links to the previous entry's `entry_hash`,
        forming a per-emitter SHA-256 hash chain (the recorder is
        one emitter; `emitter_kind` is always `recording_server`).

        When the recorder's audit buffer crosses 80% capacity the
        recorder enters degraded mode per ADR 0006 D6 and refuses
        new administrative actions (camera CRUD, policy CRUD,
        recorder config patches) with HTTP 503; recording, playback,
        snapshot, and other media-flow operations continue
        unaffected.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ItemsPerPage'
        - name: occurred_after
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: occurred_before
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: kind
          in: query
          required: false
          description: |
            Multi-value; matches `AuditLogEntry.action` (the canonical
            namespaced action name).
          schema:
            type: array
            items:
              type: string
        - name: actor_kind
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditActorKind'
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
        - name: outcome
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditOutcome'
        - name: resource_kind
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Audit log entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogEntryList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Health ===================================================

  /v1/health:
    get:
      tags: [Health]
      summary: Recorder health snapshot.
      description: |
        One snapshot, current state only. Pre-MS the network
        reachability flags default to `false` (no MS pairing client
        wired yet); a future Phase-2-followup flips them to live
        values once that client lands.
      responses:
        '200':
          description: Health snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  # ===== StorageVolumes ==========================================

  /v1/storage-volumes:
    get:
      tags: [StorageVolumes]
      summary: List storage volumes.
      description: |
        Read-only listing. Volume bootstrap config (mount paths,
        kind, priority) lives in `/v1/recorder/config`; this surface
        is observability only.
      responses:
        '200':
          description: Volume list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageVolumeList'

  /v1/storage-volumes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [StorageVolumes]
      summary: Get a storage volume.
      responses:
        '200':
          description: Volume detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageVolume'
        '400':
          description: Invalid volume id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Volume not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Recorder-localized escape hatch =========================

  /v1/recorder/identity:
    get:
      tags: [Recorder]
      summary: Recorder bootstrap identity (hostname / location / timezone / firmware).
      description: |
        Pulls hostname from `os.Hostname()`, timezone from
        `time.Local`, location from `conf.ServerLocation`, and
        firmware from the build-time-stamped recorder version.
        Hostname and timezone are read-only at this surface
        (changing them is the host OS's job); only location is
        writable via PATCH.
      responses:
        '200':
          description: Identity snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderIdentity'
    patch:
      tags: [Recorder]
      summary: Update recorder location.
      description: |
        Only `location` is patchable. Any patch body that omits
        `location` returns 400 so callers don't think they wrote
        something they didn't. `tenant_id` may be echoed back to
        confirm tenant binding (mismatch → 403). Admin-gated +
        audit-emitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecorderIdentityPatch'
      responses:
        '200':
          description: Location updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Bad body (missing `location`, malformed JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch or admin-action denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/reboot:
    post:
      tags: [Recorder]
      summary: Reboot the recorder host.
      description: |
        Admin-gated + audit-emitted. Returns success-on-queue
        immediately, then sleeps 5 seconds (so the response makes
        it back to the caller) before invoking `/sbin/reboot`.
        Best-effort: containers without CAP_SYS_BOOT log the
        failure and the process keeps running. Non-Linux hosts
        return 501 (recorder's production target is Linux/Alpine;
        the reboot semantic doesn't translate to macOS dev hosts).
      responses:
        '200':
          description: Reboot queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Reboot not supported on this OS.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/config-backup:
    get:
      tags: [Recorder]
      summary: Download the running config as JSON.
      description: |
        Returns the same shape `GET /v1/recorder/config` emits,
        with `Content-Disposition: attachment` so a browser kicks
        off a save dialog with a timestamped filename. Lets an
        operator capture a known-good state before making changes.
        Admin-gated + audit-emitted.
      responses:
        '200':
          description: Config snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderConfig'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/config-restore:
    post:
      tags: [Recorder]
      summary: Restore the running config from a JSON body.
      description: |
        Decodes the body via the same `OptionalGlobal` /
        `jsonwrapper` pathway that `PATCH /v1/recorder/config`
        uses, then validates with `Conf.Validate()` before
        applying via the standard reload path. Validation failure
        at any stage leaves the running config untouched.
        Admin-gated + audit-emitted (a warning-severity
        `config.applied` Event also fires on success).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecorderConfig'
      responses:
        '200':
          description: Config restored; recorder reloading.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Decode or validation failure; running config untouched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/network-info:
    get:
      tags: [Recorder]
      summary: Cross-platform network information for the configuration UI.
      description: |
        gopsutil-driven interface enumeration (name / MAC / MTU /
        flags / IP addresses), DNS resolvers from
        `/etc/resolv.conf` on unix, OS platform string, plus the
        bandwidth sampler's now/peak/avg over the rolling 24h
        window. Cross-platform: works on Linux, macOS, Windows,
        BSD.
      responses:
        '200':
          description: Network info snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkInfo'

  /v1/recorder/config:
    get:
      tags: [Recorder]
      summary: Recorder operational config.
      description: |
        Recorder-localized escape hatch per ADR 0009 §D6. Covers
        ~95% of MediaMTX's `GlobalConf`. Embedded credentials in
        relevant fields are redacted on read.
      responses:
        '200':
          description: Recorder config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecorderConfig'
    patch:
      tags: [Recorder]
      summary: Patch recorder operational config.
      description: |
        Partial-update semantics. Body's `tenantId`, if present,
        must match the recorder's bound tenant or the request
        returns 403. Hook strings (`runOnConnect`,
        `runOnDisconnect`) are scanned for credential markers and
        flagged in the recorder log; contents are not redacted on
        write.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecorderConfig'
      responses:
        '200':
          description: Patched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/camera-defaults:
    get:
      tags: [Recorder]
      summary: Camera defaults applied at creation.
      description: |
        Recording-policy fields (`record`, `recordPath`,
        `recordFormat`, `recordPartDuration`, `recordMaxPartSize`,
        `recordSegmentDuration`, `recordDeleteAfter`) are stripped
        from the response — the canonical mechanism for shared
        recording behavior is `RecordingPolicy` at
        `/v1/recording-policies`. The `source` field has its
        embedded userinfo redacted (canonical-divergence D4).
      responses:
        '200':
          description: Camera defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraDefaults'
    patch:
      tags: [Recorder]
      summary: Patch camera defaults.
      description: |
        Recording-policy fields in the body are rejected with 400
        and a message pointing to `/v1/recording-policies`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraDefaults'
      responses:
        '200':
          description: Patched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: |
            Bad request, including the case where
            recording-policy fields are present.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/cameras/{id}/source-config:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Recorder]
      summary: RPi-camera source-config sub-shape.
      description: |
        ~30-field RPi-camera source configuration. Hardware-
        specific; only meaningful on a recorder running on
        Raspberry Pi hardware. Not part of canonical
        `Camera.source_config`.
      responses:
        '200':
          description: RPi-camera source-config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RPiCameraSourceConfig'
        '400':
          description: Invalid camera id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Recorder]
      summary: Patch RPi-camera source-config.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RPiCameraSourceConfig'
      responses:
        '200':
          description: Patched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/cameras/{id}/hooks:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Recorder]
      summary: Per-camera shell hooks.
      description: |
        Hook strings are at minimum Sensitive — they may carry
        credentials if the operator embeds them in shell commands.
        On read the recorder scans for credential markers and emits
        a Warn log; contents are not redacted because the operator
        who set them needs to be able to read them back to edit
        them.
      responses:
        '200':
          description: Camera hooks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CameraHooks'
        '400':
          description: Invalid camera id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Recorder]
      summary: Patch per-camera shell hooks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CameraHooks'
      responses:
        '200':
          description: Patched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OK'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Tenant mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Camera not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/hls-muxers:
    get:
      tags: [Recorder]
      summary: HLS muxer list.
      description: |
        Per-camera HLS muxer state. Recorder-internal observability;
        the canonical model has no place for muxer state. Only
        registered when the recorder is built with the HLS server
        enabled. Pagination keys (`item_count`, `page_count`,
        `items_per_page`) are snake_case per the canonical /v1
        convention; the per-muxer item shape retains camelCase for
        muxer-specific fields per the escape-hatch carve-out.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
        - name: items_per_page
          in: query
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: HLS muxer list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HLSMuxerList'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/hls-muxers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: |
          Canonical Camera UUID. The legacy /v3 endpoint keyed off
          MediaMTX path-name strings; this one keys on the canonical
          camera id. The recorder resolves the UUID to a path-name
          internally — first against configured paths, then falling
          back to runtime-active muxers — so a request for a
          runtime-active path that isn't configured (e.g. concrete
          paths matching a wildcard `all_others` entry) still
          resolves correctly.
    get:
      tags: [Recorder]
      summary: Get HLS muxer state for a camera.
      description: |
        Resolution semantics (configured paths first, runtime-active
        muxers as fallback) are recorder-internal and specified here
        at the spec level; ADR 0009 §D6 (the authority for this
        endpoint living in the recorder-internal escape hatch) is
        silent on the resolution behavior.
      responses:
        '200':
          description: HLS muxer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HLSMuxer'
        '400':
          description: Invalid camera id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Muxer not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/recorder/cameras/{id}/snapshot:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: |
          Canonical Camera UUID. Same UUID-to-path-name resolution as
          `/v1/recorder/hls-muxers/{id}`: configured paths first,
          runtime-active muxers as fallback.
      - name: at
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: |
          Optional RFC3339 timestamp. When set, the snapshot is taken
          from the recorded segment that covers the timestamp (the
          segment whose start time precedes `at` and whose successor's
          start follows `at`) rather than from the live HLS muxer.
          The same libav decode/encode pipeline runs on the recorded
          segment, so the response shape (`image/jpeg` on success,
          raw fragment with `X-Snapshot-Format: hls-fragment-fallback`
          on decode failure) is identical to the live path.
          Returns 404 when no recorded segment covers the requested
          timestamp; returns 400 when the value does not parse as
          RFC3339. The 503 "muxer not producing media" response
          applies only to the live path and never to `?at=`.
    get:
      tags: [Recorder]
      summary: Video keyframe for a camera (JPEG, with raw-fragment fallback).
      description: |
        Returns a video keyframe for the camera as a JPEG image.
        Without `?at=` the recorder decodes the most recent live HLS
        fragment in-process via libav (cgo) and re-encodes the first
        decoded frame to JPEG. With `?at=<RFC3339>` the recorder
        instead decodes the recorded segment that covers that point
        in history. The response shape is signaled by the
        `X-Snapshot-Format` header:

          * `jpeg` — Body is `image/jpeg`. The recorder decoded the
            fragment and produced a single JPEG keyframe. This is the
            typical "thumbnail" or "save-this-frame" response.
          * `hls-fragment-fallback` — Conversion failed (corrupt
            fragment, codec the recorder's libav build doesn't
            support, frame with invalid dimensions, etc.). Body is
            the raw HLS fragment with the muxer's content type
            (`video/mp4` for fMP4, `video/MP2T` for MPEG-TS) so the
            endpoint stays useful for diagnostics. The recorder logs
            the underlying decode/encode error.

        Placement (ADR 0009 §D6.3): no canonical `Snapshot` entity
        exists, and defining one would be ADR-level work, so this
        endpoint lives in the recorder-localized escape hatch
        alongside `hls-muxers`. It is recorder-internal observability
        — useful to LAN tools and operator dashboards but not
        promoted to a tier-shared canonical surface.

        JPEG conversion is performed in-process via cgo bindings to
        libav (`go-astiav`). This makes cgo and libav-dev a hard
        build requirement for the recorder; the project's test
        Dockerfile installs `ffmpeg-dev`, and cross-compile users
        need a cross-toolchain that supplies libav for the target
        platform.

        No caching: each call returns the freshest available frame.
        Returns 503 when the camera resolves but the HLS muxer is not
        currently producing media.
      responses:
        '200':
          description: |
            Body is `image/jpeg` on the success path. On conversion
            failure the body is the muxer's raw fragment with its
            native content type. The `X-Snapshot-Format` response
            header (`jpeg` or `hls-fragment-fallback`) tells clients
            which branch ran.
          headers:
            X-Snapshot-Format:
              description: |
                Which response branch produced the body. `jpeg` =
                in-process libav decoded the fragment and produced a
                JPEG. `hls-fragment-fallback` = libav decode/encode
                failed; body is the muxer's raw fragment.
              schema:
                type: string
                enum: [jpeg, hls-fragment-fallback]
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            video/MP2T:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: |
            Invalid camera id, or `?at=` value that does not parse
            as RFC3339.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: |
            Camera UUID does not match any configured path or
            runtime-active muxer; or `?at=` is set but no recorded
            segment covers that timestamp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: |
            Live path only: camera is known but is not currently
            producing media (no HLS muxer registered, no instance,
            no finalized segments, or content unavailable within the
            snapshot deadline). The `?at=` recorded-history path
            never returns 503.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ===== Diagnostics =============================================
  #
  # Cross-platform diagnostic test runners powering the config
  # UI's Diagnostics page. All handlers are stdlib- or gopsutil-
  # based — no shell-outs to system tools (ping, iperf3, chronyc,
  # smartctl) — so they work identically on Linux, macOS, Windows,
  # BSD. The trade-off is that they measure recorder-internal
  # probes (TCP RTT, SNTP UDP query, TCP RTSP-handshake) rather
  # than calling out to OS tools an operator might be familiar
  # with; the values are still real measurements.

  /v1/diagnostics/ping:
    post:
      tags: [Diagnostics]
      summary: TCP-handshake latency probe.
      description: |
        Repeatedly dials TCP host:port (configurable count, capped
        at 20) with a 2-second per-probe timeout. Returns per-sample
        latencies plus aggregate average + loss%. Not raw ICMP
        (would need raw sockets / SUID); TCP RTT is the right
        "is the recorder networking healthy" signal anyway.
        Admin-gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PingRequest'
      responses:
        '200':
          description: Probe completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PingResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/diagnostics/ntp:
    post:
      tags: [Diagnostics]
      summary: SNTP drift query.
      description: |
        Stdlib SNTP (RFC 4330) UDP query against the requested
        server (default `pool.ntp.org`), three-second timeout.
        Returns offset_ms — the recorder's local-clock skew
        relative to the server, computed via the standard
        ((serverTime - t1) + (serverTime - t4)) / 2 formula. No
        host NTP daemon dependency. Admin-gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NtpRequest'
      responses:
        '200':
          description: Drift query completed (success or failure).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NtpResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /v1/diagnostics/rtsp-probe:
    post:
      tags: [Diagnostics]
      summary: TCP probe across every configured camera path.
      description: |
        Walks the recorder's path table and runs a TCP-handshake
        probe against each camera's source URL, with a 3-second
        timeout per probe. Skips publisher paths (no source to
        probe) and paths with empty source URLs. Userinfo on the
        echoed URL is redacted. Admin-gated.
      responses:
        '200':
          description: Probe completed across all paths.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RTSPProbeResponse'
        '403':
          description: Admin-action permission denied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Recorder configuration not loaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
