openapi: 3.0.0

info:
  version: 1.0.0
  title: Raikada Recording Server API
  description: |
    HTTP control API exposed by the Raikada Recording Server — the
    on-prem appliance defined in this repository. This is the recorder's
    local control surface. It is invoked by the Management Server over
    the recorder-initiated WebSocket per ADR 0003 (Connectivity model),
    and by LAN clients when authorized. Off-LAN clients reach this
    surface via the Cloud-brokered FRP tunnel.

    Schemas describe what the current implementation actually returns.
    Per-field classifications follow `../docs/data-classification.md`
    (workspace-relative). **Operational is the default**: schemas and
    fields without an explicit `x-classification` are Operational.
    Only divergent classifications (PII, Sensitive, Credential,
    Restricted) are annotated. Divergences from the canonical domain
    model in `../docs/domain-model.md` are tracked separately in
    `recorder/docs/canonical-divergences.md`.

    **`tenantId` on responses.** Every detail-level response and every
    list item carries a `tenantId` field identifying the tenant the
    recorder is bound to. The value comes from the recorder's
    bootstrap config and is the same for every response from a given
    recorder. List wrappers themselves do not carry the field; their
    items do. This closes canonical-divergence D1.

    **`tenantId` on requests.** Patch / add / replace bodies on the
    `/v3/config/*` endpoints accept an optional `tenantId` field. If
    present and matching the recorder's bound tenant the request
    proceeds; if present and mismatched the recorder returns 403. If
    omitted, the recorder uses its own tenant id implicitly.

servers:
  - url: http://localhost:9997
    description: Default LAN-side listener.

tags:
  - name: General
    description: Top-level recorder identity and metadata.
  - name: Authentication
    description: |
      Auth-system administration endpoints. Currently a single
      JWKS-refresh hook. The recorder validates inbound credentials
      via a global middleware on every endpoint; see the security
      section for accepted credential types.
  - name: Configuration
    description: |
      Persistent configuration of the recorder — global settings,
      path defaults, and per-path entries. Bodies on these endpoints
      use MediaMTX-internal `Path` shapes; the eventual mapping to
      canonical `Camera` and `RecordingPolicy` entities is tracked in
      `recorder/docs/canonical-divergences.md`.
  - name: Paths
    description: |
      Runtime view of currently-known media paths (live state, not
      configuration). In Raikada-canonical terms each path corresponds
      loosely to a `Camera` plus its active `Stream`s; the alignment
      is incomplete and is tracked in `canonical-divergences.md`.
  - name: HLS
    description: HLS muxers and active HLS playback sessions.
  - name: RTSP
    description: |
      RTSP and RTSPS connections, sessions, and session-kick. Both
      protocol variants share handlers; routes differ only in the
      `rtspsconns` / `rtspssessions` prefix for the secure variant.
  - name: RTMP
    description: |
      RTMP and RTMPS connections and connection-kick. Both protocol
      variants share handlers; routes differ only in the `rtmpsconns`
      prefix for the secure variant.
  - name: SRT
    description: SRT connections and connection-kick.
  - name: WebRTC
    description: WebRTC sessions and session-kick.
  - name: Recordings
    description: |
      On-disk recording listings and per-segment delete. Each item
      corresponds loosely to a `RecordingSegment` in the canonical
      domain model; the current shape is a small subset and is tracked
      in `canonical-divergences.md`.

security:
  - basicAuth: []
  - bearerJWT: []

components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic credentials. Validated against the recorder's
        configured auth manager (internal, HTTP, or JWT-backed) on
        every request.
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Standard JWT bearer token. Validated against JWKS held by the
        recorder's auth manager. Use `POST /v3/auth/jwks/refresh` to
        force a JWKS reload after key rotation.

        Note: a `Bearer` token that happens to contain a colon (e.g.
        the upstream MediaMTX `user:pass` convention) is treated
        opaquely as a token here, not as colon-separated credentials.
        Clients that need username+password authentication must use
        `basicAuth`. See D6 in
        `recorder/docs/canonical-divergences.md` for history.

