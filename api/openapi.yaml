      - M-JPEG
      - Opus
      - Vorbis
      - MPEG-4 Audio
      - MPEG-4 Audio LATM
      - MPEG-1/2 Audio
      - AC3
      - Speex
      - G726
      - G722
      - G711
      - LPCM
      - MPEG-TS
