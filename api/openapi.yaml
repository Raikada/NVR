    PathConf:
      type: object
      description: |
        MediaMTX-internal path configuration. Carries the recorder's
        per-path settings as serialized in `mediamtx.yml`. Exposing
        this shape at the public API surface is a canonical-rule
        violation (ADR 0001 R5: MediaMTX-internal types must not leak
        across boundaries); the canonical replacement is a `Camera`
        plus a `RecordingPolicy` per the domain model. Resolution
        will require its own ADR — the translation is non-trivial.
        Tracked in `recorder/docs/canonical-divergences.md`.

        Fields default to **Sensitive**; fields that may carry
        embedded camera credentials (`source`) are **Credential** and
        should be redacted in logs.
      x-classification: sensitive
      properties:
        tenantId:
          type: string
        name:
          type: string
          x-classification: sensitive

        # General
        source:
          type: string
          x-classification: credential
          description: |
            Source URL for the path. May contain embedded credentials
            (e.g. `rtsp://user:pass@camera/stream`) on **input**;
            **on output the userinfo portion is redacted** to
            `redacted:redacted@host` per D4 in
            `recorder/docs/canonical-divergences.md`. The recorder
            still accepts full credential-bearing URLs in PATCH /
            POST bodies; it just does not return them. The full
            canonical split into `Camera.source_url` (Sensitive,
            credential-free) plus `Camera.credentials_ref`
            (Operational pointer to a Credential-classified secret)
            lands with ADR 0009.
        sourceFingerprint:
          type: string
          x-classification: sensitive
