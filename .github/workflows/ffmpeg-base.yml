# Builds the prebuilt ffmpeg base image, ghcr.io/raikada/nvr-ffmpeg.
# Run this manually (Actions → ffmpeg-base → Run workflow) only when
# FFMPEG_VERSION changes — it is NOT part of the per-release path.
# consumer-image.yml then pulls this image instead of recompiling
# ffmpeg, cutting the appliance build to ~2-3 minutes.
name: ffmpeg-base

on:
  # Tag trigger builds from any branch (workflow_dispatch only works
  # once this file is on the default branch). Push ffmpeg-<version>,
  # e.g. ffmpeg-8.0, to (re)publish the base.
  push:
    tags: ["ffmpeg-*"]
  workflow_dispatch:
    inputs:
      ffmpeg_version:
        description: "ffmpeg release to build"
        default: "8.0"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ffmpeg-base.Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            FFMPEG_VERSION=${{ inputs.ffmpeg_version || '8.0' }}
          # Lowercase per GHCR rules; matches the FROM in consumer.Dockerfile.
          tags: ghcr.io/raikada/nvr-ffmpeg:${{ inputs.ffmpeg_version || '8.0' }}
