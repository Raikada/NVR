# Builds and publishes the consumer NVR appliance image to GHCR.
#
# Triggers: any v* tag (release) and manual dispatch (test builds).
# The NAS then deploys with `docker compose pull` — no toolchain, no
# source checkout, no on-NAS ffmpeg compile.
#
# amd64 only for now (the deployment target NAS is x86_64); arm64 under
# QEMU multiplies the ffmpeg-from-source stage into an hour-plus build.
# Add linux/arm64 to `platforms` if an ARM target ever appears.
name: consumer-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tags
        id: meta
        run: |
          REF="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${REF}" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${GITHUB_REPOSITORY@L}:${REF},ghcr.io/${GITHUB_REPOSITORY@L}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF}-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "tags=ghcr.io/${GITHUB_REPOSITORY@L}:edge" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/consumer.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          # The ffmpeg stage dominates build time; the GHA cache makes
          # subsequent releases build in minutes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
